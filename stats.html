:root{--bg:#2a0a12;--card:#4a1322;--ink:#fff6ee;--mute:#e3c3c3;--acc:#ff5d73;--gold:#ffc65c;--line:#6b2234}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:Lalezar,serif;font-size:26px;color:var(--ink);text-decoration:none}.logo svg{width:34px;height:34px}
h1{font-family:Lalezar,serif;font-weight:400;font-size:clamp(30px,5vw,42px);margin:14px 0 4px}
h3{margin:0 0 10px;font-size:17px}
.muted{color:var(--mute);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:12px;border:0;background:var(--acc);color:#2a0a12;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}.chip.on{background:var(--acc);color:#2a0a12;border-color:var(--acc);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.kpi small{color:var(--mute);display:block}.kpi b{font-size:30px;line-height:1.2;display:block}
.up{color:#7ee2a8;font-size:13px}.down{color:#ff9aa8;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.chart{width:100%;height:200px;display:block}.chart .b1{fill:var(--acc);opacity:.85}.chart .b2{fill:var(--gold)}.chart g:hover .b1{opacity:1}
.chart-x{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;direction:ltr}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.grid .card{margin:0}
.srow{position:relative;display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:8px;overflow:hidden;font-size:15px}
.srow i{position:absolute;inset:0 0 0 auto;background:rgba(255,93,115,.16);z-index:0}.srow span,.srow b{position:relative;z-index:1}
.srow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{width:20px;height:14px;object-fit:cover;border-radius:2px;vertical-align:-2px;margin-left:6px}
.scroll{max-height:380px;overflow:auto}
.empty{color:var(--mute);font-size:14px;padding:8px}
.center{text-align:center;padding:50px 10px}
label.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);cursor:pointer}
</style>

const $ = s => document.querySelector(s), el = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayId = d => d.toISOString().slice(0, 10);
const dn = (() => { try { return new Intl.DisplayNames(["ar"], { type: "region" }); } catch { return null; } })();
const SPEC = { UTC: "🖥️ توقيت عالمي (غالبًا خوادم)", XX: "🌍 غير معروف", JRS: "🕌 توقيت القدس", BOT: "🤖 روبوتات" };
const ccLabel = c => SPEC[c] ? esc(SPEC[c]) : /^[A-Z]{2}$/.test(c) ? `<img class="flag" src="https://flagcdn.com/w40/${c.toLowerCase()}.png" alt="" loading="lazy" onerror="this.remove()">${esc(c === "PS" ? "فلسطين" : (dn ? dn.of(c) : c))}` : esc(c);
const REF = { direct: "🔗 مباشر (رابط محفوظ أو مكتوب)", google: "🔍 جوجل", bing: "🔍 Bing", "other-search": "🔍 محركات بحث أخرى", facebook: "📘 فيسبوك", instagram: "📸 إنستغرام", x: "✖️ إكس (تويتر)", youtube: "▶️ يوتيوب", whatsapp: "💬 واتساب", telegram: "✈️ تلغرام", tiktok: "🎵 تيك توك" };
const DEV = { mobile: "📱 جوال", desktop: "💻 كمبيوتر", tablet: "📲 تابلت" };
const pageName = k => NAMES[k] || (k.startsWith("film_") ? "🎬 " + k.slice(5) : k.startsWith("lists_") ? "📋 " + k.slice(6) : k);
const noTrack = () => { try { return !!localStorage.getItem("qr-notrack"); } catch { return false; } };

function login(msg) {
  el.innerHTML = `<div class="card center"><h1>إحصائيات الزوار</h1><p class="muted">${msg || "هذه الصفحة لمدير الموقع فقط. سجّل الدخول بحساب Google."}</p><button class="btn" id="li">تسجيل الدخول بحساب Google</button></div>`;
  $("#li").onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { login("تعذّر تسجيل الدخول: " + esc(e.code || e.message)); } };
}
onAuthStateChanged(auth, async u => {
  if (!u) return login();
  if (u.email !== ADMIN) { login(`الحساب ${esc(u.email)} لا يملك صلاحية. سجّل الخروج وادخل بحساب المدير.`); const b = document.createElement("button"); b.className = "btn ghost"; b.textContent = "تسجيل الخروج"; b.onclick = () => signOut(auth); el.querySelector(".card").append(" ", b); return; }
  el.innerHTML = '<p class="center muted">جاري جلب الأرقام…</p>';
  const days = Array.from({ length: 90 }, (_, i) => { const d = new Date(); d.setUTCDate(d.getUTCDate() - (89 - i)); return dayId(d); });
  let denied = false;
  const docs = await Promise.all(days.map(id => getDoc(doc(db, "stats", id)).then(s => ({ id, ...(s.exists() ? s.data() : {}) })).catch(e => { if (e.code === "permission-denied") denied = true; return { id }; })));
  if (denied) return login("قاعدة البيانات رفضت القراءة لهذا الحساب.");
  let range = +(sessionStorage.getItem("qr-range") || 7);
  const draw = () => {
    const cur = docs.slice(-range), prev = docs.slice(-2 * range, -range), today = docs[docs.length - 1];
    const sum = (a, f) => a.reduce((t, d) => t + (d[f] || 0), 0);
    const merge = (a, f) => { const o = {}; a.forEach(d => Object.entries(d[f] || {}).forEach(([k, v]) => o[k] = (o[k] || 0) + v)); return Object.entries(o).sort((x, y) => y[1] - x[1]); };
    const delta = f => { const a = sum(cur, f), b = sum(prev, f); if (!b) return a ? '<span class="up">▲ جديد</span>' : ""; const p = Math.round((a - b) / b * 100); return `<span class="${p >= 0 ? "up" : "down"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p)}% عن الفترة السابقة</span>`; };
    const V = sum(cur, "views"), U = sum(cur, "visitors");
    const maxV = Math.max(1, ...cur.map(d => d.views || 0)), W = 760, Hh = 180, bw = W / cur.length;
    const bars = cur.map((d, i) => { const h = (d.views || 0) / maxV * (Hh - 16), hv = (d.visitors || 0) / maxV * (Hh - 16);
      return `<g><title>${d.id}: ${d.views || 0} مشاهدة · ${d.visitors || 0} زائر</title><rect x="${i * bw + 1}" y="${Hh - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" class="b1"/><rect x="${i * bw + bw * .25}" y="${Hh - hv}" width="${Math.max(1, bw * .5 - 1)}" height="${hv}" rx="2" class="b2"/></g>`; }).join("");
    const list = (rows, label, total, max = 12) => rows.length ? rows.slice(0, max).map(([k, v]) => `<div class="srow"><span>${label(k)}</span><b>${v.toLocaleString("ar")}</b><i style="width:${Math.round(v / (total || 1) * 100)}%"></i></div>`).join("") : '<div class="empty">لا توجد بيانات بعد.</div>';
    const cs = merge(cur, "countries"), ps = merge(cur, "pages"), rs = merge(cur, "refs"), ds = merge(cur, "devices");
    el.innerHTML = `<div class="top"><h1>إحصائيات الزوار</h1><div class="chips">${[[1, "اليوم"], [7, "7 أيام"], [28, "28 يومًا"], [90, "90 يومًا"]].map(([r, l]) => `<button class="chip${r === range ? " on" : ""}" data-r="${r}">${l}</button>`).join("")}</div></div>
      <div class="kpis">
        <div class="kpi"><small>الزوار</small><b>${U.toLocaleString("ar")}</b>${range > 1 ? delta("visitors") : ""}</div>
        <div class="kpi"><small>مشاهدات الصفحات</small><b>${V.toLocaleString("ar")}</b>${range > 1 ? delta("views") : ""}</div>
        <div class="kpi"><small>زوار اليوم</small><b>${(today.visitors || 0).toLocaleString("ar")}</b><span class="muted">${(today.views || 0).toLocaleString("ar")} مشاهدة</span></div>
        <div class="kpi"><small>صفحات لكل زائر</small><b>${U ? (V / U).toFixed(1) : "—"}</b></div>
        <div class="kpi"><small>عدد الدول</small><b>${cs.filter(([k]) => /^[A-Z]{2}$/.test(k)).length}</b></div>
      </div>
      ${range > 1 ? `<div class="card"><h3>الزوار والمشاهدات يوميًا</h3><svg class="chart" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${bars}</svg><div class="chart-x"><span>${cur[0].id}</span><span>${cur[cur.length - 1].id}</span></div><div class="legend"><span><i style="background:var(--acc)"></i>مشاهدات</span><span><i style="background:var(--gold)"></i>زوار</span></div></div>` : ""}
      <div class="grid">
        <div class="card"><h3>الدول</h3><div class="scroll">${list(cs, ccLabel, U, 80)}</div></div>
        <div class="card"><h3>أكثر الصفحات زيارة</h3><div class="scroll">${list(ps, k => esc(pageName(k)), V, 50)}</div></div>
        <div class="card"><h3>من أين جاء الزوار</h3>${list(rs, k => esc(REF[k] || "🌐 " + k.replace(/_/g, ".")), U)}</div>
        <div class="card"><h3>الأجهزة</h3>${list(ds, k => esc(DEV[k] || k), U)}</div>
      </div>
      <div class="card" style="margin-top:16px"><label class="sw"><input type="checkbox" id="nt" ${noTrack() ? "checked" : ""}> لا تحسب زياراتي من هذا الجهاز (حتى لا تختلط زياراتك بأرقام الزوار)</label>
      <p class="muted" style="margin:8px 0 0">تُحسب الدولة من المنطقة الزمنية لجهاز الزائر، و«الزائر» يُحسب مرة واحدة في اليوم لكل جهاز. الأيام بتوقيت غرينتش. لا نحفظ أي بيانات شخصية، فقط أرقام مجمّعة.</p>
      <p style="margin:12px 0 0"><button class="btn ghost" id="so">تسجيل الخروج</button></p></div>`;
    el.querySelectorAll(".chip[data-r]").forEach(b => b.onclick = () => { range = +b.dataset.r; sessionStorage.setItem("qr-range", range); draw(); });
    $("#nt").onchange = e => { try { e.target.checked ? localStorage.setItem("qr-notrack", "1") : localStorage.removeItem("qr-notrack"); } catch {} };
    $("#so").onclick = () => signOut(auth);
  };
  draw();
});
</script>
